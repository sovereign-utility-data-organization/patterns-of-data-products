# Builds the canonical OKF bundle into a static site and deploys it to GitHub Pages.
#
#   checkout            plain ubuntu runner
#   setup-python + pip  installs python-markdown (the only dependency)
#   build_site.py       rewrites OKF links to relative/resolved paths, renders every
#                       page to HTML, adds nav + a search bar + a search index
#   deploy-pages        -> GitHub Pages
#
# No Docker, no Jekyll, no native extensions: plain Python on a plain runner.
#
# REQUIREMENT: repo Settings -> Pages -> "Build and deployment" -> Source must be
# **GitHub Actions** (not "Deploy from a branch"), otherwise deploy-pages is rejected.
name: Build and deploy pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --no-cache-dir markdown

      - name: Build the site
        run: python3 scripts/build_site.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
