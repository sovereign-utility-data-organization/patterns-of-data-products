# Builds the canonical OKF bundle into a static site and deploys it to GitHub Pages.
#
#   actions/checkout        -> plain ubuntu runner (no job container)
#   docker run (Jekyll img) -> scripts/build_site.py (Python) rewrites OKF links to
#                              relative, resolved paths + adds a search bar/index,
#                              then Jekyll renders to site/
#   deploy-pages            -> GitHub Pages
#
# REQUIREMENT: repo Settings -> Pages -> "Build and deployment" -> Source must be
# set to **GitHub Actions** (not "Deploy from a branch"), otherwise the
# deploy-pages step will be rejected.
name: Build and deploy pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the site (Jekyll image doing Jekyll build)
        run: |
          set -euo pipefail
          docker run --rm --user 0 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            jekyll/jekyll:builder \
            bash -c "command -v python3 >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends python3); \
                     python3 scripts/build_site.py && \
                     JEKYLL_ENV=production jekyll build --source site-src --destination site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
